[project]
name = "ircopilot"
version = "0.1.0"
description = "Local-only, read-only incident response copilot for Docker and Kubernetes (Ollama + Qdrant RAG, MCP tools)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx==0.28.1",
    "mcp==2.3.0",
    "pyyaml==6.0.3",
]

[project.scripts]
ircopilot = "ircopilot.cli:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
